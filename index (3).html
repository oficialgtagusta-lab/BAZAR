async function gen(){const n=Math.min(500,Math.max(1,+$('#qn').value||1)),v=+$('#qv').value||0,c=[];const{data:ini,error}=await sb.rpc('reservar_qr',{qtd:n});if(error)return toast('Erro ao reservar QR: '+error.message);for(let i=0;i<n;i++){const id='BBM-'+String(+ini+i).padStart(4,'0');D.p.push({id,s:null,r:null,n:null,d:'',v,st:'livre',dt:null});c.push(id)}save();render();pq(c)}

$('#lp').addEventListener('keydown',ev=>ev.key=='Enter'&&login());
const DE=[];for(let i=0;i<20;i++){const w=document.createElement('div'),im=new Image();im.src=DOOD[i%DOOD.length];w.className='dd';w.style.cssText='left:'+((i*37)%96)+'%;top:'+((i*53)%92)+'%;width:'+(40+Math.random()*44)+'px;--dur:'+(9+Math.random()*10)+'s;--dl:-'+Math.random()*9+'s';w.append(im);$('#bg').append(w);DE.push(w)}
addEventListener('pointermove',ev=>DE.forEach(w=>{const r=w.getBoundingClientRect(),dx=r.left+r.width/2-ev.clientX,dy=r.top+r.height/2-ev.clientY,d=Math.hypot(dx,dy)||1,f=d<170?(170-d)/170*70:0;w.firstChild.style.transform='translate('+dx/d*f+'px,'+dy/d*f+'px) rotate('+f*2+'deg) scale('+(1+f/110)+')'}));
addEventListener('pointerdown',ev=>DE.forEach(w=>{const r=w.getBoundingClientRect();if(Math.hypot(r.left+r.width/2-ev.clientX,r.top+r.height/2-ev.clientY)<150){w.classList.add('pop');setTimeout(()=>w.classList.remove('pop'),850)}}));
sb.auth.getSession().then(({data})=>data.session&&boot(data.session.user));
</script></body></html>
